name: Bug report
description: Something in Beam doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Missing windows or tabs? Check permissions first: Accessibility (windows) and Automation → Google Chrome (tabs), in System Settings → Privacy & Security."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: beam
    attributes:
      label: Beam version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version (if it's about tabs)
  - type: checkboxes
    id: perms
    attributes:
      label: Permissions
      options:
        - label: Beam is enabled under Accessibility
        - label: Beam is allowed to control Google Chrome under Automation
