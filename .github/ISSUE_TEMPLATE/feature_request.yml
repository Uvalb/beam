name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Beam is deliberately narrow (apps, windows, Chrome tabs and tab groups). Please read the non-goals in docs/product.md first; file search, calculators, web search and plugins are out of scope."
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
