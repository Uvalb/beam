<!doctype html>
<html><head><meta charset="utf-8"><title>Beam-in mockup</title>
<style>
:root{--bg:#e9e9ee;--panel:rgba(255,255,255,.82);--fg:#1d1d1f;--muted:#8a8a8f;--icon:#6e6e73}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1f;--panel:rgba(48,48,52,.88);--fg:#f2f2f5;--muted:#8e8e93;--icon:#aeaeb2}}
body{margin:0;background:var(--bg);font:14px -apple-system,system-ui,sans-serif;color:var(--fg);display:flex;flex-direction:column;align-items:center;padding:60px 16px}
.bar{width:680px;max-width:100%;height:56px;border-radius:14px;background:var(--panel);box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;align-items:center;position:relative;overflow:hidden}
canvas{position:absolute;left:0;top:0}
.ph{margin-left:56px;font-size:24px;font-weight:300;color:var(--muted)}
.controls{margin-top:28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font:inherit;padding:6px 14px;border-radius:8px;border:1px solid var(--muted);background:transparent;color:var(--fg);cursor:pointer}
label{color:var(--muted);display:flex;gap:6px;align-items:center}
</style></head><body>
<div class="bar"><canvas id="c"></canvas><span class="ph">Beam to…</span></div>
<div class="controls">
  <button id="play">Replay (or press Space)</button>
  <label>Duration <input id="dur" type="range" min="80" max="1000" step="10" value="630"> <span id="durv">630</span>ms</label>
  <label>Jitter <input id="jit" type="range" min="0" max="80" value="50"> <span id="jitv">50</span>px</label>
  <label>Crossfade <input id="xf" type="range" min="0" max="1000" step="10" value="560"> <span id="xfv">560</span>ms</label>
  <label><input id="slow" type="checkbox"> 10× slow-mo</label>
</div>
<script>
// 12x12 magnifying glass bitmap, drawn at 2px per pixel (24pt icon)
// Low-fi bitmap is rasterized from the same geometry as the hi-fi icon,
// so the pixel ring lands exactly on the vector ring.
const N=12, PS=2, S=N*PS;
const GEO={cx:S*0.42, cy:S*0.42, r:S*0.33, ring:2.2, handle:2.6};
function rasterize(){
  const {cx,cy,r,ring,handle}=GEO;
  const hx0=cx+r*0.72, hy0=cy+r*0.72, hx1=S*0.94, hy1=S*0.94;
  const rows=[];
  for(let y=0;y<N;y++){let row='';for(let x=0;x<N;x++){
    const px=(x+0.5)*PS, py=(y+0.5)*PS;
    const onRing=Math.abs(Math.hypot(px-cx,py-cy)-r)<=ring/2+0.05;
    // distance to handle segment
    const dx=hx1-hx0, dy=hy1-hy0, t=Math.max(0,Math.min(1,((px-hx0)*dx+(py-hy0)*dy)/(dx*dx+dy*dy)));
    const onHandle=Math.hypot(px-hx0-t*dx,py-hy0-t*dy)<=handle/2+0.3;
    row+=(onRing||onHandle)?'#':'.';
  }rows.push(row)}
  return rows;
}
const ICON=rasterize();
const P=2, X0=20, ICON_PX=ICON[0].length*P;
const c=document.getElementById('c'), ctx=c.getContext('2d');
const dpr=devicePixelRatio||1;
function size(){const b=c.parentElement.getBoundingClientRect();c.width=b.width*dpr;c.height=b.height*dpr;c.style.width=b.width+'px';c.style.height=b.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
size(); addEventListener('resize',()=>{size();ctx.clearRect(0,0,c.width,c.height);drawHiFi(1)});
const Y0=(56-ICON.length*P)/2;
let pixels=[], t0=0, dur=200;
function setup(){
  const jit=+jitv.textContent;
  pixels=[];
  ICON.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(ch!=='#')return;
    const fx=X0+x*P;
    // start just off the left edge of the input, with horizontal jitter; y is fixed
    const sx=-ICON_PX+x*P-Math.random()*jit;
    // stagger: pixels nearer the leading (right) edge depart first; spread up to 40% of total
    const delay=(1-x/ICON[0].length)*0.4*Math.random()+0.0;
    pixels.push({fx,sx,y:Y0+y*P,delay});
  }));
}
const ease=t=>1-Math.pow(1-t,3);
function draw(el){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--icon');
  for(const p of pixels){
    const span=1-p.delay;
    const t=Math.min(1,Math.max(0,(el/dur-p.delay)/span));
    if(t<=0)continue;
    const x=p.sx+(p.fx-p.sx)*ease(t);
    // snap to the pixel grid so it reads as pixelated while moving
    ctx.globalAlpha=Math.min(1,t*3);
    ctx.fillRect(Math.round(x/P)*P,p.y,P,P);
  }
  ctx.globalAlpha=1;
}
const SWAP=90; // ms crossfade from pixel art to hi-fi icon
function drawHiFi(a){
  ctx.save();ctx.globalAlpha=a;
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--icon');
  ctx.lineCap='round';
  const s=ICON_PX, cx=X0+GEO.cx, cy=Y0+GEO.cy, r=GEO.r;
  ctx.lineWidth=GEO.ring;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=GEO.handle;ctx.beginPath();
  ctx.moveTo(cx+r*0.72,cy+r*0.72);ctx.lineTo(X0+s*0.94,Y0+s*0.94);ctx.stroke();
  ctx.restore();
}
function play(){
  dur=+durv.textContent*(slow.checked?10:1);
  setup(); t0=performance.now();
  const swap=Math.max(1,+xfv.textContent*(slow.checked?10:1));
  (function f(now){
    const el=now-t0;
    if(el<dur){draw(el);}
    else{
      // pixels in place → crossfade to the high-fidelity icon
      const a=Math.min(1,(el-dur)/swap);
      draw(dur);ctx.globalCompositeOperation='destination-out';
      ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,c.width,c.height);
      ctx.globalCompositeOperation='source-over';
      drawHiFi(a);
      if(a>=1)return;
    }
    requestAnimationFrame(f);
  })(t0);
}
dur_=document.getElementById('dur');
dur_.oninput=()=>durv.textContent=dur_.value;
xf.oninput=()=>xfv.textContent=xf.value;
jit.oninput=()=>jitv.textContent=jit.value;
document.getElementById('play').onclick=play;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play()}});
play();
</script></body></html>
